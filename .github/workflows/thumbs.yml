name: Collect publication thumbnails (helper)

# One-off helper: the GitHub runner has full internet access (arxiv.org, openaccess.thecvf.com, ...),
# so it downloads each paper's representative figure and commits it to snapshot/img/pubthumb/.
# Nothing here touches the site build; the images are attached to the Notion DB afterwards.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated Order numbers to (re)process — blank = every paper without a thumbnail"
        default: ""
      force:
        description: "Re-download even if a thumbnail already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["tools/**"]

permissions:
  contents: write

concurrency:
  group: thumbs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pymupdf requests
      - name: Collect figures
        run: python tools/collect_thumbs.py --only "${{ github.event.inputs.only }}" ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/img/pubthumb tools/thumb_report.json tools/thumb_debug
          git diff --cached --quiet || git commit -m "Thumbnails: collected publication figures (automated helper)"
          git push
