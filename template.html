<title>MLV Lab</title>
<meta name="description" content="Machine Learning and Vision Lab, KAIST">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{
  --navy:#1B3358; --navy-deep:#0F1F38; --navy-soft:#E8EEF7; --ink:#1F2937; --muted:#6B7280; --line:#E3E7EE;
  --bg:#FFFFFF; --band:#F4F6F9; --surface:#FFFFFF; --accent:#2457A6; --warm:#B7410E; --warm-soft:#FDECE3;
  --shadow:0 1px 2px rgba(15,31,56,.06),0 10px 30px -18px rgba(15,31,56,.25);
  --body:"Figtree","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"Figtree","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;   /* small labels/dates: same face, tabular numbers (no monospace) */
  --code:ui-monospace,SFMono-Regular,Menlo,monospace;
  --t1:#DCEBFF; --t1i:#1E4E9B; --t2:#DFF5E8; --t2i:#1D6B45; --t3:#F1E4FF; --t3i:#6D2FA0; --t4:#FFE9D6; --t4i:#9A4B00;
  --t5:#DDF3F6; --t5i:#0B6B78; --t6:#FDE2E2; --t6i:#9B1C1C; --t7:#FFF3C7; --t7i:#7A5A00;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(30px,4.2vw,46px);font-weight:700;letter-spacing:-.02em}
h2{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.015em}
h3{font-size:20px;font-weight:700;color:var(--navy)}
h4{font-size:16px;font-weight:700}
p{margin:0}
.label{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.prose{max-width:70ch}
.prose p+p{margin-top:.9em}
.prose ul{margin:.5em 0 .8em;padding-left:1.2em}
.prose li{margin:.25em 0}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--navy-deep);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px;max-width:1280px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap;text-transform:uppercase;line-height:1.1;flex:none}   /* never shrinks → can't overlap the tabs */
.brand:hover{text-decoration:none}
.brand img{height:32px;width:auto;border-radius:3px;background:#fff;padding:2px}
.brand small{display:block;font:500 10px/1.3 var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.65);text-transform:uppercase;margin-top:3px}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:8px 8px;color:rgba(255,255,255,.72);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a:hover{color:#fff;text-decoration:none}
nav.tabs a.active{color:#fff;border-bottom-color:#fff}
.sbtn{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border:1px solid rgba(255,255,255,.28);border-radius:999px;color:rgba(255,255,255,.8);font-size:13px;white-space:nowrap;flex:none}
.sbtn:hover{background:rgba(255,255,255,.1)}
.sbtn kbd{font-family:var(--code);font-size:11px;padding:1px 6px;border:1px solid rgba(255,255,255,.3);border-radius:5px}
.sbtn svg{width:15px;height:15px}
button.menu{display:none;padding:8px;border-radius:999px;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.28)}
button.menu:hover{background:rgba(255,255,255,.1)}
button.menu svg{width:18px;height:18px}
.sbtn span{display:none}   /* compact search button (icon + / key) so all 9 tabs always fit */
@media (max-width:1500px){.brand small{display:none}}
@media (max-width:1150px){nav.tabs a{padding:8px 5px;letter-spacing:.02em;font-size:11.5px}}
@media (max-width:1000px){
  nav.tabs{position:fixed;inset:66px 0 auto 0;background:var(--navy-deep);flex-direction:column;padding:10px 16px 16px;display:none;margin:0}
  nav.tabs.open{display:flex}
  button.menu{display:inline-flex;margin-left:auto}
}

/* ---------- page banner ---------- */
.banner{position:relative;background:var(--navy-deep);color:#fff;overflow:hidden}
.banner img{width:100%;height:280px;object-fit:cover;object-position:center 40%;opacity:.55}
.banner.tall img{height:min(58vh,520px);opacity:.6}
.banner .copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.banner h1{color:#fff}
.banner .sub{margin-top:8px;font-size:14px;color:rgba(255,255,255,.85);letter-spacing:.02em}
.banner.tall .sub{font-size:17px;max-width:60ch;margin-top:14px}
.banner .cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:6px;font-weight:700;font-size:13.5px;border:1px solid transparent;letter-spacing:.02em}
.btn:hover{text-decoration:none;filter:brightness(1.08)}
.btn.primary{background:#fff;color:var(--navy)}
.btn.ghost{border-color:rgba(255,255,255,.6);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.line{border-color:var(--line);color:var(--navy);background:#fff}

/* ---------- sections ---------- */
section.block{padding:52px 0}
section.block.band{background:var(--band)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head p{color:var(--muted);margin-top:6px;max-width:70ch}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.tally span{font-family:var(--mono);font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff}
.tally b{color:var(--navy);font-weight:700;margin-right:4px}
.about{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.side-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:16px 18px}
.side-card h4{color:var(--navy);margin-bottom:4px}
.side-card p{color:var(--muted);font-size:14.5px}
@media (max-width:820px){.about{grid-template-columns:1fr}}
/* carousel */
.carousel{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.carousel .frame{aspect-ratio:16/9;background:#0F1F38;position:relative}
.carousel .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s ease}
.carousel .frame img.on{opacity:1}
.carousel .cap{display:flex;align-items:center;gap:14px;padding:13px 18px;border-top:1px solid var(--line)}
.carousel .cap p{flex:1;font-size:15px}
.carousel .cap .idx{font-family:var(--mono);font-size:12px;color:var(--muted)}
.carousel .arrows{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);background:#fff}
.iconbtn:hover{background:var(--band)}
.iconbtn svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.carousel .frame img{transition:none}}

/* ---------- motion: scroll-reveal + hover feedback ---------- */
.rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.rv.in{opacity:1;transform:none}
.pub{transition:background-color .2s ease;border-radius:8px;margin:0 -14px;padding-left:14px;padding-right:14px}
.pub:hover{background:#F6F8FB;box-shadow:inset 3px 0 0 var(--navy)}
@media print{.rv{opacity:1;transform:none}}
.pub .thumb{transition:box-shadow .25s ease}
.pub .thumb img{transition:transform .35s ease}
.pub:hover .thumb img{transform:scale(1.04)}
.pub:hover .thumb{box-shadow:0 8px 20px rgba(15,31,56,.12)}
.pub h4 a{transition:color .15s}
.person,.fig,.video,.pgrid figure{transition:transform .25s ease,box-shadow .25s ease}
.person:hover,.fig:hover,.video:hover,.pgrid figure:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(15,31,56,.12)}
.video .th .play{transition:transform .2s ease,background-color .2s}
.video:hover .th .play{transform:translate(-50%,-50%) scale(1.12);background:rgba(27,51,88,.85)}
.chip{transition:filter .15s}
.topicbar .chip:hover,#ptopic .chip:hover{filter:brightness(.94)}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.pub .thumb img,.person,.fig,.video,.pgrid figure{transition:none}}
/* news */
.news li{display:grid;grid-template-columns:100px 1fr;gap:18px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.news li:last-child{border-bottom:1px solid var(--line)}
.news time{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.news .pill{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.08em;padding:4px 6px;border-radius:4px;background:var(--warm-soft);color:var(--warm);vertical-align:1px;margin-left:6px}
.news p{font-size:15px}
ul.plain{list-style:none;margin:0;padding:0}
.collab{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.collab img{display:block;margin:0 auto;width:100%;max-width:980px;max-height:560px;object-fit:contain}

/* ---------- chips ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 9px;border-radius:5px;background:var(--navy-soft);color:var(--navy);white-space:nowrap;line-height:1.3;max-width:100%}
.titlerow .chip{white-space:normal;text-align:left}
.chip.t1{background:var(--t1);color:var(--t1i)} .chip.t2{background:var(--t2);color:var(--t2i)} .chip.t3{background:var(--t3);color:var(--t3i)} .chip.t4{background:var(--t4);color:var(--t4i)}
.chip.t5{background:var(--t5);color:var(--t5i)} .chip.t6{background:var(--t6);color:var(--t6i)} .chip.t7{background:var(--t7);color:var(--t7i)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.soft{background:var(--band);color:var(--muted);font-weight:400}
button.chip{cursor:pointer;border:1px solid transparent}
button.chip.on{outline:2px solid var(--navy);outline-offset:1px}
.topicbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.topicbar .chip{padding:8px 12px;font-size:13px;border-radius:6px}
.topicbar .chip.all{background:var(--navy);color:#fff}

/* ---------- people ---------- */
.group-head{display:flex;align-items:baseline;gap:12px;margin:38px 0 16px}
.group-head h2{font-size:22px}
.faculty{display:grid;grid-template-columns:240px 1fr;gap:34px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px;box-shadow:var(--shadow)}
.faculty .photo{border-radius:8px;overflow:hidden;aspect-ratio:4/5;background:var(--band)}
.faculty .photo img{width:100%;height:100%;object-fit:cover}
.faculty h3{font-size:26px}
.faculty .pos{color:var(--muted);margin-top:4px}
.faculty .affil{margin-top:12px;font-size:14.5px;color:var(--muted)}
.faculty .affil a{color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.faculty .bio{margin-top:16px;font-size:15px}
.faculty .awards{margin-top:16px}
.faculty .awards li{font-size:14.5px;padding:6px 0;border-top:1px solid var(--line)}
.faculty>div{min-width:0}
@media (max-width:700px){.faculty{grid-template-columns:1fr;gap:20px;padding:20px}.faculty .photo{max-width:240px}}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.links a,.links button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:5px;background:var(--navy);color:#fff}
.links a.sec,.links button.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.links a:hover,.links button:hover{text-decoration:none;filter:brightness(1.1)}
.links svg{width:13px;height:13px}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.person{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s ease,transform .15s ease}
.person:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.person .photo{aspect-ratio:4/5;background:var(--band);overflow:hidden;position:relative;display:block}
.person .photo img{width:100%;height:100%;object-fit:cover;object-position:center top}
.person .photo .init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--muted)}
.person .photo .ext{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:999px;background:rgba(15,31,56,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.person .photo .ext svg{width:13px;height:13px}
.person .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.person .name{font-weight:700;font-size:17px;color:var(--navy)}
.person .name a{color:var(--navy)}
.person .name small{font-weight:400;color:var(--muted);font-size:13px;margin-left:5px}
.person .pos{font-size:13px;color:var(--muted)}
.person .chips .chip{font-size:11px;padding:3px 7px}
.person .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;gap:6px}
.person .icons{display:flex;gap:4px}
.person .icons a{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--navy);border:1px solid var(--line)}
.person .icons a:hover{background:var(--navy-soft);text-decoration:none}
.person .icons svg{width:14px;height:14px}
.person .pubs{font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--navy);border-bottom:1px solid var(--line)}
.person .pubs:hover{text-decoration:none;border-bottom-color:var(--navy)}
table.list{width:100%;border-collapse:collapse;font-size:14.5px}
table.list th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:2px solid var(--navy)}
table.list td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list td.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
table.list td a{color:var(--navy);font-weight:700}
.tablewrap{overflow-x:auto}

/* ---------- publications ---------- */
.toolbar{position:sticky;top:66px;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.toolbar .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.input{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:240px;flex:1}
.input input{border:0;background:none;font:inherit;color:inherit;width:100%;outline:none}
.input svg{width:15px;height:15px;color:var(--muted);flex:none}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font-size:13px;font-weight:700;padding:6px 10px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg button:hover:not(.on){background:var(--band)}
.filter-note{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;background:var(--navy-soft);color:var(--navy);font-size:14px;margin:12px 0 4px}
.filter-note button{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.year-head{display:flex;align-items:baseline;gap:12px;margin:36px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--navy)}
.year-head h3{font-size:28px;font-weight:700}
.year-head .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pub{display:grid;grid-template-columns:184px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
/* fixed 184×115 frame; the whole figure is always shown (object-fit:contain), never cropped or blown up */
.pub .thumb{aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;align-self:start}
.pub .thumb img{width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box;background:#fff}
.pub .thumb button{width:100%;height:100%;display:block;cursor:zoom-in}
.pub .thumb button:hover img{opacity:.9}
.pub .thumb .tile{font:700 20px/1 var(--body);color:var(--navy);text-align:center;padding:10px;letter-spacing:-.01em}
.pub .thumb .tile small{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.08em;color:var(--muted);margin-top:6px}
.pub h4{font-size:16.5px;line-height:1.35;display:inline}
.pub h4 a{color:var(--ink)}
.pub h4 a:hover{color:var(--navy)}
.pub .titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pub .authors{margin-top:5px;font-size:14.5px;color:var(--muted);line-height:1.6}
.pub .authors .m{color:var(--ink);font-weight:700;border-bottom:1px dashed var(--line)}
.pub .authors .m:hover{color:var(--navy);border-bottom-color:var(--navy)}
.pub .authors .m.on{color:var(--navy);border-bottom:2px solid var(--navy)}
.pub .venue{margin-top:4px;font-size:14px;font-style:italic;color:var(--muted)}
.pub .venue em{font-style:normal;color:var(--warm);font-weight:700}
.pub .links{margin-top:9px}
.pub .links a{font-size:12px;padding:4px 9px}
.pub .note{margin-top:6px;font-size:13px;color:var(--muted)}
@media (max-width:640px){.pub{grid-template-columns:1fr}.pub .thumb{max-width:260px}}
.empty{padding:40px 0;color:var(--muted);text-align:center}

/* ---------- research ---------- */
.topic{padding:44px 0;border-top:1px solid var(--line);scroll-margin-top:80px}
.topic:first-of-type{border-top:0}
.topic .desc{margin-top:14px;max-width:72ch;font-size:15.5px}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.figs.n1{grid-template-columns:minmax(0,560px)} .figs.n2{grid-template-columns:repeat(2,1fr)} .figs.n4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.figs,.figs.n4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.figs,.figs.n2,.figs.n4{grid-template-columns:1fr}}
.fig{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;margin:0}
.fig button{width:100%;display:block;cursor:zoom-in}
.fig img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;padding:8px;box-sizing:border-box;display:block}
.fig figcaption{flex:1;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--muted);border-top:1px solid var(--line);min-height:56px}
.related{margin-top:22px}
.related h4{margin-bottom:8px;color:var(--navy)}
.related li{display:grid;grid-template-columns:132px 1fr;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:start}
.related li .v{font-family:var(--mono);font-size:12.5px;font-weight:500;line-height:1.4;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.related li{grid-template-columns:1fr;gap:2px}}
.related li a{color:var(--ink)}
.related li a:hover{color:var(--navy)}

/* ---------- teaching ---------- */
.teach-year{margin-top:26px}
.teach-year h3{font-size:24px;font-weight:700;margin-bottom:6px}

/* ---------- photos (row-major grid: newest top-left → oldest bottom-right) ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pgrid figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.pgrid figure button{width:100%;display:block;aspect-ratio:4/3;background:var(--band);overflow:hidden}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.pgrid figure:hover img{transform:scale(1.03)}
.pgrid figcaption{padding:9px 11px;font-size:12.5px;color:var(--muted);white-space:pre-line}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,16,32,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:min(96vw,1200px);max-height:78vh;object-fit:contain;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lightbox p{color:#fff;margin-top:14px;font-size:15px;text-align:center;max-width:70ch}
.lightbox .x{position:absolute;top:18px;right:18px;color:#fff;font-size:28px;line-height:1;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.12)}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.lightbox .nav.l{left:16px}.lightbox .nav.r{right:16px}
.lightbox .nav svg{width:20px;height:20px}

/* ---------- mlv tv ---------- */
.socials{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.socials a{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font-weight:700;font-size:14px}
.socials a:hover{text-decoration:none;background:var(--band)}
.socials img{width:26px;height:26px;border-radius:999px;object-fit:cover}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.video{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;color:var(--ink)}
.video:hover{text-decoration:none;border-color:var(--navy)}
.video .th{position:relative;aspect-ratio:16/9;background:#000}
.video .th img{width:100%;height:100%;object-fit:cover}
.video .th .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:999px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.video .th .play svg{width:18px;height:18px;fill:#fff;margin-left:2px}
.video .t{padding:10px 12px;font-size:14px;font-weight:700;line-height:1.35}
.video .vd{padding:0 12px 10px;font-size:12px;color:var(--muted);margin-top:-4px}
.video .pill{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.08em;padding:3px 5px;border-radius:4px;background:var(--warm-soft);color:var(--warm)}
.player{position:fixed;inset:0;z-index:100;background:rgba(8,16,32,.92);display:flex;align-items:center;justify-content:center;padding:24px}
.player .box{width:min(96vw,1100px);aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.card h3{margin-bottom:10px}
.card .addr{white-space:pre-line;font-size:15px;line-height:1.7}
.embed{margin-top:18px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.embed iframe{width:100%;height:380px;border:0;display:block}
.embed .ph{padding:26px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.embed .ph p{color:var(--muted);font-size:14px}
@media (max-width:760px){.contact{grid-template-columns:1fr}}

/* ---------- openings ---------- */
.openings{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:36px;align-items:start}
.openings .side{position:sticky;top:90px}
@media (max-width:820px){.openings{grid-template-columns:1fr}.openings .side{position:static}}
.status{display:inline-flex;align-items:center;gap:8px;font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--warm-soft);color:var(--warm)}
.status i{width:7px;height:7px;border-radius:999px;background:currentColor;display:inline-block}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}
.langs button{padding:7px 14px;font-size:13.5px;font-weight:700;color:var(--muted)}
.langs button.on{background:var(--navy);color:#fff}

/* ---------- search ---------- */
.search{position:fixed;inset:0;z-index:90;background:rgba(8,16,32,.55);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px}
.search .panel{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.search .input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:17px}
.search .results{max-height:60vh;overflow:auto;padding:8px}
.search .grp{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.search .hit{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:6px;color:var(--ink)}
.search .hit:hover,.search .hit:focus{background:var(--band);text-decoration:none}
.search .hit b{font-weight:700;color:var(--navy)}
.search .hit small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.search .hit mark{background:var(--navy-soft);color:var(--navy);border-radius:3px;padding:0 1px}
.search .hint{padding:10px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px}

/* ---------- footer ---------- */
footer{background:var(--navy-deep);color:rgba(255,255,255,.75);padding:36px 0 44px;font-size:13.5px;margin-top:40px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer .fb{color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
footer a{color:#fff}
.note{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.5)}

<script id="assets" type="application/json">__ASSETS__</script>
<script id="data" type="application/json">__DATA__</script>
<script>
const MODE = "__MODE__";
const A = JSON.parse(document.getElementById('assets').textContent);
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.site;
// Safety net: if a single-value field arrived as a markdown link "[x](y)" (Notion auto-link), unwrap it to the bare URL/email.
for (const k of ['site_url','pi_email','apply_email','scholar','map_embed','calendar_embed','map_link','calendar_link']) {
  const m = /^\s*\[([^\]]*)\]\(([^)]*)\)\s*$/.exec(S[k] || '');
  if (m) S[k] = (m[2] || m[1]).replace(/^mailto:/, '');
}
const img = k => A[k] || '';
const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const inline = t => esc(t)
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,b)=> b.startsWith('#')||b.startsWith('mailto:') ? `<a href="${b}">${a}</a>` : `<a href="${b}" target="_blank" rel="noopener">${a}</a>`)
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').slice(0,48)}${u.length>56?'…':''}</a>`);
function md(src){
  const lines = String(src||'').split('\n'); const out=[]; let para=[], list=[];
  const flushP=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join('<br>')+'</p>'); para=[]; } };
  const flushL=()=>{ if(list.length){ out.push('<ul>'+list.map(l=>'<li>'+inline(l)+'</li>').join('')+'</ul>'); list=[]; } };
  for(const raw of lines){
    const l = raw.replace(/\s+$/,'');
    if(!l.trim()){ flushP(); flushL(); continue; }
    if(/^\s*[-•]\s+/.test(l)){ flushP(); list.push(l.replace(/^\s*[-•]\s+/,'')); continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL(); return out.join('');
}
const ICON = {
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  scholar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9Z"/></svg>',
  cv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 13v6H5V6h6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M6 4v16l14-8z"/></svg>',
};
const TABS = [['home','Home'],['people','People'],['research','Research'],['publications','Publications'],['teaching','Teaching'],['photos','Photos'],['mlvtv','MLV TV'],['contact','Contact'],['openings','Openings']];
const byId = new Map(D.people.map(p=>[p.id,p]));
const pubsOf = id => D.pubs.filter(p=>p.members.includes(id));
const pubCount = new Map(D.people.map(p=>[p.id,pubsOf(p.id).length]));
const topicById = new Map(D.topics.map(t=>[t.id,t]));
const shortTopic = t => ({1:'AGI & Multimodal QA',2:'AI for Science',3:'Generative Models',4:'Visual Understanding',5:'INR & 3D Vision',6:'Safe AI',7:'Medical Imaging'})[t.id] || t.name;
const topicChip = (id, extra='') => { const t=topicById.get(id); return t ? `<span class="chip t${id} ${extra}">${esc(shortTopic(t))}</span>` : ''; };
const banner = (key, title, sub, tall=false, extra='') => `<section class="banner ${tall?'tall':''}"><img src="${img(key)}" alt=""><div class="copy"><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}${extra}</div></section>`;

/* ---------- routing ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/,'') || 'home';
  const [page, qs] = h.split('?'); const q = new URLSearchParams(qs||'');
  const r = RENDER[page] ? page : 'home';
  if(window.__ctimer){ clearInterval(window.__ctimer); window.__ctimer=null; }
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('active',a.dataset.p===r));
  document.getElementById('tabs').classList.remove('open');
  const main = document.getElementById('main');
  main.innerHTML = RENDER[r](q);
  document.title = (r==='home'?'':TABS.find(t=>t[0]===r)[1]+' · ')+'MLV Lab';
  window.scrollTo({top:0,behavior:'instant'});
  if(AFTER[r]) AFTER[r](q);
  reveal();
  if(q.get('t')){ const el=document.getElementById(q.get('t')); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50); }
}

/* ---------- scroll-reveal: cards/rows fade in as they enter the viewport (once) ---------- */
const REVEAL_SEL = '.pub, .person, .faculty, .fig, .video, .pgrid figure, .news li, .topic, .teach-year, .card, .collab';
let __io = null;
function reveal(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
  if (!__io) __io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); __io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  const els = [...document.querySelectorAll(REVEAL_SEL)].filter(el => !el.classList.contains('rv'));
  els.forEach((el, i) => { el.classList.add('rv'); el.style.transitionDelay = (Math.min(i % 12, 8) * 40) + 'ms'; __io.observe(el); });
  // anything already in view gets shown right away (no flash of empty page)
  requestAnimationFrame(() => els.forEach(el => { const r = el.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) el.classList.add('in'); }));
}

/* ---------- home ---------- */
function venueTally(){
  const c = {}; D.pubs.forEach(p=>{ if(p.type==='Conference') c[p.venue_short]=(c[p.venue_short]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6);
}
function homePage(){
  const cur = D.people.filter(p=>p.status==='Current').length, alum = D.people.filter(p=>p.status==='Alumni').length;
  const tally = venueTally().map(([v,n])=>`<span><b>${n}</b>${esc(v)}</span>`).join('');
  const news = D.news.slice(0,S.home_news_count);
  const cta = `<div class="cta"><a class="btn primary" href="#/publications">Publications</a><a class="btn ghost" href="#/people">People</a>${S.openings_open?`<a class="btn ghost" href="#/openings">Openings</a>`:''}</div>`;
  return banner('hero','Machine Learning and Vision Lab','School of Computing, KAIST',true,cta) + `
  <section class="block"><div class="wrap about">
    <div>
      <h2>About</h2>
      <div class="prose" style="margin-top:14px;font-size:16px">${md(S.intro)}</div>
      <div class="tally"><span><b>${D.pubs.length}</b>publications</span>${tally}<span><b>${cur}</b>members</span><span><b>${alum}</b>alumni</span></div>
    </div>
    <div class="side">
      <div class="side-card"><h4>Join us</h4><p>Graduate applicants (대학원 지원) and undergraduate interns (학부 인턴): <a href="mailto:${S.pi_email}">${S.pi_email}</a></p></div>
      ${S.openings_open?`<div class="side-card"><h4>Open positions</h4><p>${esc(S.openings_title)}. <a href="#/openings">Read the call →</a></p></div>`:''}
      <div class="side-card"><h4>Research areas</h4><div class="chips" style="margin-top:6px">${D.topics.map(t=>`<a href="#/research?t=topic${t.id}" style="text-decoration:none">${topicChip(t.id)}</a>`).join('')}</div></div>
    </div>
  </div></section>
  <section class="block band"><div class="wrap">
    <div class="sec-head"><h2>Highlights</h2></div>
    <div class="carousel" id="carousel">
      <div class="frame">${D.highlights.map((h,i)=>`<img src="${img(h.img)}" alt="" class="${i===0?'on':''}" loading="${i<2?'eager':'lazy'}">`).join('')}</div>
      <div class="cap"><span class="idx" id="cidx">1 / ${D.highlights.length}</span><p id="ccap">${esc(D.highlights[0].caption)}</p><div class="arrows"><button class="iconbtn" id="cprev" aria-label="Previous">${ICON.left}</button><button class="iconbtn" id="cnext" aria-label="Next">${ICON.right}</button></div></div>
    </div>
  </div></section>
  <section class="block"><div class="wrap">
    <div class="sec-head"><h2>News</h2><button class="btn line" id="morenews">Show all ${D.news.length}</button></div>
    <ul class="news plain" id="newslist">${news.map(newsRow).join('')}</ul>
  </div></section>
  <section class="block band"><div class="wrap">
    <div class="sec-head"><h2>Supports &amp; Collaborators</h2></div>
    <div class="collab"><img src="${img('collab')}" alt="Supports and collaborators"></div>
  </div></section>`;
}
// NEW badge is automatic: the newest N items (Site Content `home_new_count`, default 5). The Notion "New" checkbox is not used.
const NEW_N = Number(S.home_new_count) > 0 ? Number(S.home_new_count) : 5;
const newsRow = (n, i) => `<li><time>${n.date}</time><p>${md(n.md).replace(/^<p>|<\/p>$/g,'')}${i < NEW_N ? '<span class="pill">NEW</span>' : ''}</p></li>`;
function homeAfter(){
  let i=0; const imgs=[...document.querySelectorAll('#carousel .frame img')]; if(!imgs.length) return;
  const show=k=>{ i=(k+imgs.length)%imgs.length; imgs.forEach((im,j)=>im.classList.toggle('on',j===i)); document.getElementById('cidx').textContent=`${i+1} / ${imgs.length}`; document.getElementById('ccap').textContent=D.highlights[i].caption; };
  window.__ctimer = setInterval(()=>show(i+1),6000);
  const reset=()=>{clearInterval(window.__ctimer);window.__ctimer=setInterval(()=>show(i+1),6000)};
  document.getElementById('cprev').onclick=()=>{show(i-1);reset()};
  document.getElementById('cnext').onclick=()=>{show(i+1);reset()};
  document.getElementById('morenews').onclick=e=>{ document.getElementById('newslist').innerHTML=D.news.map(newsRow).join(''); e.target.remove(); };
}

/* ---------- people ---------- */
const GROUPS = [['Post-doctoral researcher','Postdoctoral Researchers'],['Ph.D. Student','Ph.D. Students'],['Master Student','Master Students'],['Undergraduate Student','Undergraduate Students'],['Intern','Interns']];
function personCard(p){
  const links = [
    p.email?`<a href="mailto:${esc(p.email)}" title="Email" aria-label="Email">${ICON.mail}</a>`:'',
    p.scholar?`<a href="${esc(p.scholar)}" target="_blank" rel="noopener" title="Google Scholar" aria-label="Google Scholar">${ICON.scholar}</a>`:'',
    p.homepage?`<a href="${esc(p.homepage)}" target="_blank" rel="noopener" title="Personal homepage" aria-label="Personal homepage">${ICON.home}</a>`:'',
    p.cv?`<a href="${esc(p.cv)}" target="_blank" rel="noopener" title="CV" aria-label="CV">${ICON.cv}</a>`:'',
  ].join('');
  const n = pubCount.get(p.id)||0;
  const chips = p.interests.slice(0,3).map(i=>`<span class="chip soft">${esc(i)}</span>`).join('');
  const initials = p.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2);
  const photoInner = p.photo?`<img src="${img(p.photo)}" alt="${esc(p.name)}" loading="lazy">`:`<div class="init">${esc(initials)}</div>`;
  const photo = p.homepage
    ? `<a class="photo" href="${esc(p.homepage)}" target="_blank" rel="noopener" title="Open personal homepage">${photoInner}<span class="ext">${ICON.ext}</span></a>`
    : `<div class="photo">${photoInner}</div>`;
  const name = p.homepage ? `<a href="${esc(p.homepage)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
  return `<article class="person" id="p${p.id}">
    ${photo}
    <div class="body">
      <div class="name">${name}<small>${esc(p.ko)}</small></div>
      <div class="pos">${esc(p.position)}</div>
      <div class="chips">${chips}</div>
      <div class="foot"><div class="icons">${links}</div>${n?`<a class="pubs" href="#/publications?author=${p.id}">Show papers</a>`:''}</div>
    </div></article>`;
}
function peoplePage(){
  const pi = D.people.find(p=>p.group==='Faculty');
  const cur = D.people.filter(p=>p.status==='Current');
  const groups = GROUPS.map(([g,label])=>{ const list=cur.filter(p=>p.group===g); if(!list.length) return ''; return `<div class="group-head" id="g-${g.replace(/\W+/g,'-')}"><h2>${label}</h2><span class="label">${list.length}</span></div><div class="people-grid">${list.map(personCard).join('')}</div>`; }).join('');
  const alumni = (g)=>D.people.filter(p=>p.group===g);
  const alTable = (title,list)=>`<div class="group-head"><h2>${title}</h2><span class="label">${list.length}</span></div><div class="tablewrap"><table class="list"><thead><tr><th>Name</th><th>이름</th><th>Graduated</th><th>Now</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>${p.homepage?`<a href="${esc(p.homepage)}" target="_blank" rel="noopener">${esc(p.name)}</a>`:esc(p.name)}</td><td class="mono">${esc(p.ko)}</td><td class="mono">${esc(p.graduated)}</td><td>${esc(p.after.replace(/^is now /,''))}</td><td class="mono">${pubCount.get(p.id)?`<a href="#/publications?author=${p.id}">Show papers</a>`:''}</td></tr>`).join('')}</tbody></table></div>`;
  return banner('banner_people','People',`${cur.length} members · ${D.people.length-cur.length} alumni`) + `<div class="wrap">

/* ---------- publications ---------- */
const TYPES = ['Conference','Journal','Workshop','Preprint','Thesis','Book chapter'];
function pubRow(p, activeAuthor){
  const nn = s => s.toLowerCase().split(/\s+/).filter(w=>w.replace('.','').length>1).join('').replace(/[^a-z]/g,'');
  const authors = p.authors.split(/,\s*/).map(a=>{
    const m = p.members.map(id=>byId.get(id)).find(x=>x && nn(x.name)===nn(a));
    return m ? `<button class="m ${activeAuthor===m.id?'on':''}" data-a="${m.id}">${esc(a)}</button>` : esc(a);
  }).join(', ');
  const links = Object.entries(p.links).map(([k,v])=>`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join('');
  const paper = p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Paper</a>` : '';
  const short = p.venue_short.replace(' Workshop','W');
  const yr = String(p.year).slice(2);
  const chips = `<span class="chip">${esc(p.venue_short)}</span>` + (p.badge?`<span class="chip warm">${esc(p.badge)}</span>`:'') + (p.topics||[]).map(t=>topicChip(t)).join('');
  return `<article class="pub" id="pub${p.id}">
    <div class="thumb">${p.thumb?`<button data-fig="${p.id}" aria-label="Enlarge figure"><img src="${img(p.thumb)}" alt="" loading="lazy"></button>`:`<div class="tile">${esc(short)}<small>${p.type==='Conference'||p.type==='Workshop'?"'"+yr:p.year}</small></div>`}</div>
    <div>
      <div class="titlerow"><h4>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`:esc(p.title)}</h4>${chips}</div>
      <div class="authors">${authors}</div>
      <div class="venue">${esc(p.venue)}${p.presentation?` <em>· ${esc(p.presentation)}</em>`:''}</div>
      ${p.collab?`<div class="note">Collaboration with ${esc(p.collab)}</div>`:''}
      ${p.note&&!p.presentation.includes(p.note)?`<div class="note">${esc(p.note)}</div>`:''}
      ${(paper||links)?`<div class="links">${paper}${links}</div>`:''}
    </div></article>`;
}
let PF = {q:'', year:'', type:'', author:null, topic:null};
let yearCut = 0;
function pubsPage(q){
  PF = {q:'', year:'', type:'', author: q.get('author')?+q.get('author'):null, topic: q.get('topic')?+q.get('topic'):null};
  const years = [...new Set(D.pubs.map(p=>p.year))].sort((a,b)=>b-a);
  yearCut = years[0] - 6;   // e.g. 2026 → buttons 2020…2026 and "~2019"
  return banner('hero','Publications',`${D.pubs.length} papers · ${years[years.length-1]}–${years[0]}`) + `<div class="wrap">
    <div class="topicbar" id="ptopic"><button class="chip all ${PF.topic?'':'on'}" data-v="">Show All</button>${D.topics.map(t=>`<button class="chip t${t.id} ${PF.topic===t.id?'on':''}" data-v="${t.id}">${esc(shortTopic(t))}</button>`).join('')}</div>
    <div class="toolbar"><div class="row">
      <label class="input">${ICON.search}<input id="pq" placeholder="Search title, author, venue…" autocomplete="off"></label>
      <div class="seg" id="ptype"><button class="on" data-v="">All types</button>${TYPES.filter(t=>D.pubs.filter(p=>p.type===t).length>=2).map(t=>`<button data-v="${t}">${t}</button>`).join('')}</div>
    </div>
    <div class="row" style="margin-top:8px"><div class="seg" id="pyear"><button class="on" data-v="">All years</button>${years.filter(y=>y>=yearCut).map(y=>`<button data-v="${y}">${y}</button>`).join('')}${years.some(y=>y<yearCut)?`<button data-v="old">~${yearCut-1}</button>`:''}</div></div>
    <div id="pnote"></div></div>
    <div id="plist"></div>
    <div style="height:32px"></div>
  </div>`;
}
function renderPubs(){
  let list = D.pubs.slice();
  const q = PF.q.trim().toLowerCase();
  if(PF.author) list = list.filter(p=>p.members.includes(PF.author));
  if(PF.topic) list = list.filter(p=>(p.topics||[]).includes(PF.topic));
  if(PF.year==='old') list = list.filter(p=>p.year<yearCut); else if(PF.year) list = list.filter(p=>String(p.year)===PF.year);
  if(PF.type) list = list.filter(p=>p.type===PF.type);
  if(q) list = list.filter(p=>(p.title+' '+p.authors+' '+p.venue+' '+p.venue_short+' '+p.pid).toLowerCase().includes(q));
  const note = document.getElementById('pnote'); let notes=[];
  if(PF.author){ const a=byId.get(PF.author); notes.push(`Papers by <b>${esc(a.name)}</b> (${esc(a.ko)})`); }
  if(PF.topic){ const t=topicById.get(PF.topic); notes.push(`Topic: <b>${esc(t.name)}</b>`); }
  note.innerHTML = notes.length ? `<div class="filter-note">${notes.join(' · ')}<button id="pclear">Show all</button></div>` : '';
  document.querySelectorAll('#ptopic .chip').forEach(b=>b.classList.toggle('on', (b.dataset.v||'')===(PF.topic?String(PF.topic):'')));
  const years = [...new Set(list.map(p=>p.year))].sort((a,b)=>b-a);
  const html = years.map(y=>{ const ps=list.filter(p=>p.year===y); return `<div class="year-head"><h3>${y}</h3><span class="count">${ps.length}</span></div>${ps.map(p=>pubRow(p,PF.author)).join('')}`; }).join('');
  document.getElementById('plist').innerHTML = html || `<div class="empty">No papers match. Try a shorter search or clear the filters.</div>`;
  const pc = document.getElementById('pclear'); if(pc) pc.onclick=()=>{ PF.author=null; PF.topic=null; history.replaceState(null,'','#/publications'); renderPubs(); };
  reveal();
  document.querySelectorAll('#plist [data-fig]').forEach(b=>b.onclick=()=>{ const p=D.pubs.find(x=>x.id===+b.dataset.fig); openLightbox([{img:p.thumb, caption:p.title}], 0); });
  document.querySelectorAll('#plist .m').forEach(b=>b.onclick=()=>{ PF.author = PF.author===+b.dataset.a ? null : +b.dataset.a; history.replaceState(null,'','#/publications'+(PF.author?'?author='+PF.author:'')); renderPubs(); window.scrollTo({top:0,behavior:'smooth'}); });
}
function pubsAfter(){
  document.getElementById('pq').oninput = e=>{ PF.q=e.target.value; renderPubs(); };
  const seg=(id,key)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); PF[key]=b.dataset.v; renderPubs(); });
  seg('ptype','type'); seg('pyear','year');
  document.querySelectorAll('#ptopic .chip').forEach(b=>b.onclick=()=>{ PF.topic = b.dataset.v ? +b.dataset.v : null; history.replaceState(null,'','#/publications'+(PF.topic?'?topic='+PF.topic:'')); renderPubs(); });
  renderPubs();
}

function openLightbox(items, i){
  const ov=document.getElementById('overlay');
  const show=k=>{ i=(k+items.length)%items.length; ov.querySelector('img').src=img(items[i].img); ov.querySelector('p').textContent=items[i].caption||''; };
  ov.innerHTML=`<div class="lightbox" role="dialog"><button class="x" aria-label="Close">×</button><button class="nav l" aria-label="Previous">${ICON.left}</button><img src="" alt=""><p></p><button class="nav r" aria-label="Next">${ICON.right}</button></div>`;
  show(i);
  const close=()=>{ ov.innerHTML=''; document.removeEventListener('keydown',key); };
  const key=e=>{ if(e.key==='Escape')close(); if(e.key==='ArrowLeft')show(i-1); if(e.key==='ArrowRight')show(i+1); };
  ov.querySelector('.x').onclick=close; ov.querySelector('.l').onclick=()=>show(i-1); ov.querySelector('.r').onclick=()=>show(i+1);
  if(items.length<2) ov.querySelectorAll('.nav').forEach(n=>n.remove());   // single image: no prev/next
  ov.querySelector('.lightbox').onclick=e=>{ if(e.target.classList.contains('lightbox')) close(); };
  document.addEventListener('keydown',key);
}

/* ---------- search ---------- */
function openSearch(){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="search"><div class="panel"><label class="input">${ICON.search}<input id="sq" placeholder="Search people, papers, topics, news…" autocomplete="off"></label><div class="results" id="sres"><div class="hint">Type to search across ${D.people.length} people, ${D.pubs.length} papers, ${D.topics.length} topics and ${D.news.length} news items.</div></div></div></div>`;
  const inp=ov.querySelector('#sq'); inp.focus();
  const close=()=>{ ov.innerHTML=''; document.removeEventListener('keydown',key); };
  const key=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',key);
  ov.querySelector('.search').onclick=e=>{ if(e.target.classList.contains('search')) close(); };
  const hl=(t,q)=>esc(t).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
  inp.oninput=()=>{
    const q=inp.value.trim(); const res=ov.querySelector('#sres'); if(q.length<2){ res.innerHTML=''; return; }
    const lq=q.toLowerCase(); const has=(...xs)=>xs.join(' ').toLowerCase().includes(lq);
    const people=D.people.filter(p=>has(p.name,p.ko,p.position,p.interests.join(' '))).slice(0,6);
    const pubs=D.pubs.filter(p=>has(p.title,p.authors,p.venue,p.venue_short,String(p.year))).slice(0,8);
    const topics=D.topics.filter(t=>has(t.name,t.desc)).slice(0,4);
    const news=D.news.filter(n=>has(n.md)).slice(0,5);
    let h='';
    if(people.length) h+=`<div class="grp">People</div>`+people.map(p=>`<a class="hit" href="#/people?t=p${p.id}"><b>${hl(p.name,q)}</b> <span class="muted">${esc(p.ko)}</span><small>${esc(p.position||p.group)}${p.interests.length?' · '+hl(p.interests.slice(0,3).join(', '),q):''}</small></a>`).join('');
    if(pubs.length) h+=`<div class="grp">Publications</div>`+pubs.map(p=>`<a class="hit" href="#/publications?t=pub${p.id}"><b>${hl(p.title,q)}</b><small>${hl(p.authors,q)} · ${esc(p.venue_short)} ${p.year}</small></a>`).join('');
    if(topics.length) h+=`<div class="grp">Research topics</div>`+topics.map(t=>`<a class="hit" href="#/research?t=topic${t.id}"><b>${hl(t.name,q)}</b></a>`).join('');
    if(news.length) h+=`<div class="grp">News</div>`+news.map(n=>`<a class="hit" href="#/home"><b>${n.date}</b><small>${hl(n.md.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1'),q)}</small></a>`).join('');
    res.innerHTML = h || `<div class="hint">Nothing found for “${esc(q)}”.</div>`;
    res.querySelectorAll('.hit').forEach(a=>a.addEventListener('click',close));
  };
}
